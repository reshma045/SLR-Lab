<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detection History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:start}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
.tag.agree{color:var(--ok)}.tag.differ{color:var(--warn)}
.chartwrap{height:420px;position:relative}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page grid">
  <div class="stats" id="stats"></div>
  <div class="cols">
    <section class="card"><h2>Recognised signs<span class="sp"></span>
      <input type="text" id="q" placeholder="Search sign / English…" style="max-width:220px">
      <a class="btn sm" href="/api/history.csv">Export CSV</a><button class="btn sm danger" id="clearBtn">Clear</button></h2>
      <div class="tablewrap" style="max-height:70vh"><table><thead><tr><th>Time</th><th>Sign</th><th>Confidence</th><th>Claude</th><th>Claude's reason</th></tr></thead>
        <tbody id="rows"></tbody></table></div></section>
    <section class="card"><h2>Most recognised</h2><div class="chartwrap"><canvas id="chart"></canvas></div></section>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  JSL.nav();
  await JSL.settings();
  let chart = null;
  async function load() {
    const d = await JSL.api("/api/history?q=" + encodeURIComponent($("q").value));
    const s = d.stats;
    $("stats").innerHTML = `<div class="stat"><div class="v">${s.total}</div><div class="k">Total recognised</div></div>
      <div class="stat"><div class="v">${s.last_24h}</div><div class="k">Last 24 h</div></div>
      <div class="stat"><div class="v">${JSL.pct(s.avg_confidence)}</div><div class="k">Avg confidence</div></div>
      <div class="stat"><div class="v">${s.claude_checked ? JSL.pct(s.claude_agreed / s.claude_checked) : "—"}</div><div class="k">Claude agreement (${s.claude_checked} checked)</div></div>`;
    $("rows").innerHTML = d.rows.map(r => {
      const cl = r.claude_status === "done" ? `<span class="tag ${r.claude_sign === r.sign ? "agree" : "differ"}">${r.claude_sign === r.sign ? "✓ agrees" : JSL.esc(r.claude_sign)}</span> <span class="muted small">${JSL.esc(r.claude_model || "")}</span>`
        : r.claude_status ? `<span class="muted small">${JSL.esc(r.claude_status)}</span>` : "";
      return `<tr><td class="small">${JSL.time(r.ts)}</td><td class="jp">${JSL.esc(r.sign)} <span class="muted small">${JSL.esc(r.english)}</span></td>
        <td>${JSL.pct(r.confidence)}</td><td>${cl}</td><td class="small muted" style="white-space:normal;max-width:360px">${JSL.esc(r.claude_reason || "")}</td></tr>`;
    }).join("") || `<tr><td colspan="5" class="muted">Nothing yet - signs recognised on the Live page are logged here.</td></tr>`;
    if (window.Chart) {
      const labels = s.by_sign.map(x => x.sign), vals = s.by_sign.map(x => x.n);
      if (!chart) chart = new Chart($("chart"), { type: "bar", data: { labels, datasets: [{ data: vals, backgroundColor: "#3b82f6" }] },
        options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { precision: 0 } } } } });
      else { chart.data.labels = labels; chart.data.datasets[0].data = vals; chart.update(); }
    }
  }
  let deb; $("q").oninput = () => { clearTimeout(deb); deb = setTimeout(load, 250); };
  $("clearBtn").onclick = async () => { if (confirm("Delete the whole detection history?")) { await JSL.api("/api/history", { method: "DELETE" }); load(); } };
  load(); setInterval(load, 10000);
})();
</script>
</body>
</html>
